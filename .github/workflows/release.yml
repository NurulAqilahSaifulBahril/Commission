name: Release

# Push a version tag to cut a release:
#   git tag v1.2.0 && git push origin v1.2.0
#
# Publishes platform-specific assets:
#   CommissionDashboard-Setup-<ver>.exe         Windows installer
#   CommissionDashboard-Setup-<ver>-macos.zip   macOS app bundle
#   CommissionDashboard-update-<ver>.zip        OTA package (both platforms)
# plus SHA256SUMS.txt for integrity verification.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.2.0)"
        required: true

permissions:
  contents: write

jobs:
  # Shared: Build the platform-agnostic update package once
  build-update-package:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ github.event.inputs.version }}".TrimStart("v")
          } else {
            $v = "${{ github.ref_name }}".TrimStart("v")
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $v"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build update package
        shell: pwsh
        run: python tools/build_package.py --version ${{ steps.ver.outputs.version }}

      - name: Upload update package
        uses: actions/upload-artifact@v4
        with:
          name: update-package
          path: dist/CommissionDashboard-update-*.zip
          retention-days: 1

  # Windows: Build installer
  build-windows:
    runs-on: windows-latest
    needs: build-update-package

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Electron shell (Windows)
        shell: pwsh
        working-directory: 10. Electron App/app
        run: |
          npm ci
          npx electron-builder --win --dir

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          & $iscc `
            /DAppVersion=${{ needs.build-update-package.outputs.version }} `
            "installer\CommissionDashboard.iss"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/CommissionDashboard-Setup-*.exe
          retention-days: 1

  # macOS: Build app bundle
  build-macos:
    runs-on: macos-latest
    needs: build-update-package

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Electron shell (macOS)
        working-directory: 10. Electron App/app
        run: |
          npm ci
          npx electron-builder --mac --dir

      - name: Package macOS app
        shell: bash
        run: |
          VERSION="${{ needs.build-update-package.outputs.version }}"
          SOURCE="10. Electron App/app/dist/mac/Commission Portal.app"
          OUTPUT="dist/CommissionDashboard-Setup-${VERSION}-macos.zip"
          mkdir -p dist
          cd "10. Electron App/app/dist"
          zip -r "../../../${OUTPUT}" "Commission Portal.app"
          ls -lh "../../../${OUTPUT}"

      - name: Upload macOS bundle
        uses: actions/upload-artifact@v4
        with:
          name: macos-bundle
          path: dist/CommissionDashboard-Setup-*-macos.zip
          retention-days: 1

  # Publish: Combine all artifacts and create release
  publish:
    runs-on: ubuntu-latest
    needs: [build-update-package, build-windows, build-macos]
    if: always() && needs.build-update-package.result == 'success'

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize artifacts
        shell: bash
        run: |
          mkdir -p dist
          mv artifacts/update-package/* dist/ 2>/dev/null || true
          mv artifacts/windows-installer/* dist/ 2>/dev/null || true
          mv artifacts/macos-bundle/* dist/ 2>/dev/null || true
          ls -lh dist/

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt || true
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-update-package.outputs.tag }}
          name: ${{ needs.build-update-package.outputs.tag }}
          generate_release_notes: true
          body: |
            ## Finance Commission Dashboard ${{ needs.build-update-package.outputs.tag }}

            **New here?**
            - **Windows**: Download **CommissionDashboard-Setup-${{ needs.build-update-package.outputs.version }}.exe** and run it.
            - **macOS**: Download **CommissionDashboard-Setup-${{ needs.build-update-package.outputs.version }}-macos.zip**, extract it, and run Commission Portal.app.

            **Already installed?** Do nothing — the dashboard detects this release
            on its own and shows an **Install Update** button in the sidebar.
          files: |
            dist/CommissionDashboard-Setup-*.exe
            dist/CommissionDashboard-Setup-*-macos.zip
            dist/CommissionDashboard-update-*.zip
            dist/SHA256SUMS.txt
