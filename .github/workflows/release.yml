name: Release

# Push a version tag to cut a release:
#   git tag v1.2.0 && git push origin v1.2.0
#
# Publishes the Windows installer and the code-only OTA update package.
#
# The Windows asset is the Inno installer compiled from
# installer/CommissionDashboard.iss over dist/payload -- NOT electron-builder's
# output. That distinction matters: this workflow used to publish the portable
# shell exe renamed to "...-Setup-<ver>.exe", which is the Electron window and
# nothing else. It carries no "8. Web Dashboard", no Python runtime, so
# main.js's findCommissionRoot() found no app.py and every download died on
# "Could not find the dashboard files". A real installer is ~120 MB against the
# shell's ~80 MB; if this asset ever comes out at 80 MB again, ISCC did not run.
#
# macOS is deliberately NOT published. tools/build_package.py carries constants
# for it (SHELL_BUILD_MAC, PYTHON_MAC_URL, MAC_APP_NAME) but nothing references
# them -- there is no code path that stages the dashboard and an arm64 runtime
# next to the .app the way the Windows payload does. Zipping the bare .app just
# reproduces the failure described above on a platform that cannot even fall
# back to "Launch Dashboard.bat", so it is better to ship nothing than that.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.2.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ github.event.inputs.version }}".TrimStart("v")
          } else {
            $v = "${{ github.ref_name }}".TrimStart("v")
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $v"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Must precede build_package.py: it copies dist/win-unpacked into the
      # payload as shell/, and check_shell_fresh() aborts the build if that
      # folder is older than main.js.
      - name: Build Electron shell
        working-directory: 10. Electron App/app
        run: |
          npm ci
          npm run dist

      # No --seed-env here. That flag bakes live access keys into the installer
      # and this artifact is public; keys reach staff through IT, and the
      # dashboard shows a setup page explaining that when .env is empty.
      - name: Stage payload and OTA package
        shell: pwsh
        run: python tools/build_package.py --version ${{ steps.ver.outputs.version }}

      - name: Locate Inno Setup
        id: inno
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host "Inno Setup is not on the runner image - installing it."
            choco install innosetup --no-progress -y
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe not found after installing Inno Setup." }
          Write-Host "Using $iscc"
          "iscc=$iscc" >> $env:GITHUB_OUTPUT

      - name: Compile Windows installer
        shell: pwsh
        run: >
          & "${{ steps.inno.outputs.iscc }}"
          /DAppVersion=${{ steps.ver.outputs.version }}
          "installer\CommissionDashboard.iss"

      # The installer is the whole point of the release, and a shell-only exe
      # looks identical to a working one in the assets list. Fail the build
      # rather than publish that again.
      - name: Verify the installer carries a payload
        shell: pwsh
        run: |
          $exe = "dist\CommissionDashboard-Setup-${{ steps.ver.outputs.version }}.exe"
          if (-not (Test-Path $exe)) { throw "ISCC produced no installer at $exe" }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB)
          Write-Host "Installer: $exe ($mb MB)"
          if ($mb -lt 100) {
            throw "Installer is ${mb} MB - too small to contain the bundled Python runtime. It is probably the bare Electron shell."
          }

      # build_package.py wrote SHA256SUMS.txt before the installer existed;
      # this folds the installer in. updater.py matches lines by exact asset
      # name, so this has to cover everything the release publishes.
      - name: Refresh checksums
        shell: pwsh
        run: python tools/build_package.py --checksums-only

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            dist/CommissionDashboard-Setup-*.exe
            dist/CommissionDashboard-update-*.zip
            dist/SHA256SUMS.txt
          retention-days: 1

  publish:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: List what is being published
        run: ls -lh dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: ${{ needs.build.outputs.tag }}
          generate_release_notes: true
          body: |
            ## Commission Dashboard ${{ needs.build.outputs.tag }}

            **Windows**: CommissionDashboard-Setup-${{ needs.build.outputs.version }}.exe

            Sign in with the username and password IT gave you — the installer
            does not ask you to create an account. Ask IT for your access keys
            and add them to `.env` in the install folder.

            macOS is not available for download yet.

            Existing users: auto-update is enabled in the dashboard.
          files: |
            dist/CommissionDashboard-Setup-*.exe
            dist/CommissionDashboard-update-*.zip
            dist/SHA256SUMS.txt
