name: Release

# Push a version tag to cut a release:
#   git tag v1.2.0 && git push origin v1.2.0
#
# Publishes a Windows installer, macOS disk images (both ARM64 and x86_64),
# and the code-only OTA update package.
#
# EACH PLATFORM JOB BUILDS ITS OWN PAYLOAD. That is not redundancy, it is the
# fix for the way this broke: the payload used to be staged in one job and the
# installer compiled in another, on a different runner with a different
# filesystem. dist/payload simply did not exist when ISCC ran, and a Windows
# build that had worked for several releases failed at "Compile Windows
# installer" for no reason visible in the step name.
#
# NOTHING CROSSES A JOB BOUNDARY THROUGH ACTIONS ARTIFACTS. The version job
# opens a draft release and each platform job attaches its own finished
# installers to it; the publish job pulls them back down only to write one
# SHA256SUMS.txt over the lot, then flips the draft live. The artifact
# hand-off this replaced is what broke v1.2.29: both platforms built and
# verified cleanly, then the run failed on "Artifact storage quota has been
# hit" -- a limit no change in this repository could have raised.
#
# The Windows asset is the Inno installer compiled from
# installer/CommissionDashboard.iss over dist/payload -- NOT electron-builder's
# output. An earlier workflow published the portable shell exe renamed to
# "...-Setup-<ver>.exe": the Electron window with no "8. Web Dashboard" and no
# Python, so findCommissionRoot() found no app.py and every download died on
# "Could not find the dashboard files". A real installer is ~120 MB against the
# shell's ~80 MB, and both platform jobs assert on that size.
#
# ACCESS KEYS. The installer can ship with .env pre-filled so staff never paste
# tokens. That is off unless BOTH hold: the PG_* repository secrets exist, and
# the repository is PRIVATE. Release assets inherit repository visibility, so a
# seeded installer on a public repo hands live database credentials to anyone
# who finds the URL -- secrets present on a public repo is a hard failure, not
# a warning. With no secrets set the build produces a key-free installer.
#
# The OTA zip is never seeded: it is built from the code file list, where *.env
# is excluded.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.2.0)"
        required: true

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ github.event.inputs.version }}"
          else
            v="${{ github.ref_name }}"
          fi
          v="${v#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          echo "Building version $v"

      # Opened here, before either platform job runs, so both have somewhere
      # to upload to and neither races the other into creating it. It stays a
      # draft until the publish job has attached the checksums.
      - name: Open a draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          draft: true

  windows:
    runs-on: windows-latest
    needs: version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Must precede build_package.py: it copies dist/win-unpacked into the
      # payload as shell/, and check_shell_fresh() aborts if that folder is
      # older than main.js.
      - name: Build Electron shell
        working-directory: 10. Electron App/app
        run: |
          npm ci
          npm run dist

      - name: Decide whether to seed access keys
        id: seed
        shell: pwsh
        env:
          HAS_KEYS: ${{ secrets.PG_MIRROR_TOKEN != '' }}
          HAS_UPDATE_TOKEN: ${{ secrets.UPDATE_GITHUB_TOKEN != '' }}
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          "update_token=$($env:HAS_UPDATE_TOKEN)" >> $env:GITHUB_OUTPUT
          if ($env:HAS_KEYS -ne 'true') {
            Write-Host "No PG_* secrets configured - building a key-free installer."
            "seed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          if ($env:IS_PRIVATE -ne 'true') {
            throw "PG_* secrets are configured but this repository is PUBLIC. A seeded installer attached to a public release exposes live database credentials to anyone who finds the URL. Make the repository private before tagging, or remove the secrets."
          }
          "seed=true" >> $env:GITHUB_OUTPUT

      - name: Write seed .env from secrets
        if: steps.seed.outputs.seed == 'true'
        shell: pwsh
        env:
          PG_PROXY_URL: ${{ secrets.PG_PROXY_URL }}
          PG_PROXY_TOKEN: ${{ secrets.PG_PROXY_TOKEN }}
          PG_PROXY_DB: ${{ secrets.PG_PROXY_DB }}
          PG_MIRROR_TOKEN: ${{ secrets.PG_MIRROR_TOKEN }}
          PG_MIRROR_DB: ${{ secrets.PG_MIRROR_DB }}
          PG_MIRROR_SCHEMA: ${{ secrets.PG_MIRROR_SCHEMA }}
        run: |
          $names = 'PG_PROXY_URL','PG_PROXY_TOKEN','PG_PROXY_DB',
                   'PG_MIRROR_TOKEN','PG_MIRROR_DB','PG_MIRROR_SCHEMA'
          $lines = @()
          foreach ($n in $names) {
            $v = [Environment]::GetEnvironmentVariable($n)
            if ($v) { $lines += "$n=$v" }
          }
          Set-Content -Path "ci-seed.env" -Value $lines -Encoding ascii
          Write-Host "Wrote ci-seed.env with $($lines.Count) key line(s)."

      # The step whose absence broke the previous attempt: it creates
      # dist/payload, which the .iss compiles and the OTA zip is cut from.
      - name: Stage payload and OTA package
        shell: pwsh
        run: |
          $seedArg = @()
          if ("${{ steps.seed.outputs.seed }}" -eq "true") {
            $seedArg = @("--seed-env", "ci-seed.env")
          }
          python tools/build_package.py --version ${{ needs.version.outputs.version }} @seedArg

      - name: Add the update token to the staged .env
        if: steps.seed.outputs.seed == 'true' && steps.seed.outputs.update_token == 'true'
        shell: pwsh
        env:
          UPDATE_GITHUB_TOKEN: ${{ secrets.UPDATE_GITHUB_TOKEN }}
        run: |
          $envFile = "dist/payload/.env"
          if (-not (Test-Path $envFile)) { throw "$envFile is missing - staging did not seed it." }
          Add-Content -Path $envFile -Value "UPDATE_GITHUB_TOKEN=$env:UPDATE_GITHUB_TOKEN" -Encoding ascii

      - name: Remove the seed file
        if: always()
        shell: pwsh
        run: Remove-Item "ci-seed.env" -Force -ErrorAction SilentlyContinue

      - name: Locate Inno Setup
        id: inno
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe not found after installing Inno Setup." }
          "iscc=$iscc" >> $env:GITHUB_OUTPUT

      - name: Compile Windows installer
        shell: pwsh
        run: >
          & "${{ steps.inno.outputs.iscc }}"
          /DAppVersion=${{ needs.version.outputs.version }}
          "installer\CommissionDashboard.iss"

      - name: Verify the installer carries a payload
        shell: pwsh
        run: |
          $exe = "dist\CommissionDashboard-Setup-${{ needs.version.outputs.version }}.exe"
          if (-not (Test-Path $exe)) { throw "ISCC produced no installer at $exe" }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB)
          Write-Host "Installer: $exe ($mb MB)"
          if ($mb -lt 100) {
            throw "Installer is ${mb} MB - too small to contain the bundled Python runtime."
          }

      # Straight to the draft release, not to an Actions artifact. The
      # artifact hand-off is what broke v1.2.29: both platforms built and
      # verified cleanly, then the run died on "Artifact storage quota has been
      # hit" and threw finished installers away at the last step. Nothing about
      # the build was wrong, and nothing in the repo could have fixed it.
      - name: Attach Windows assets to the draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          draft: true
          files: |
            dist/CommissionDashboard-Setup-*.exe
            dist/CommissionDashboard-update-*.zip

  macos:
    runs-on: macos-latest
    needs: version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Electron app bundle
        working-directory: 10. Electron App/app
        run: |
          npm ci
          npm run dist

      # electron-builder's output directory depends on target arch and config.
      # Print it rather than assume: guessing wrong fails deep inside packaging
      # with a message that does not name the real problem.
      - name: Show what electron-builder produced
        run: ls -la "10. Electron App/app/dist"

      # Same rule as the Windows job, and for the same reason: a seeded image
      # carries live database credentials, and release assets inherit
      # repository visibility. Secrets present on a PUBLIC repo is a hard
      # failure, not a warning. With no secrets set, the build produces
      # key-free images and staff paste their own keys.
      - name: Decide whether to seed access keys
        id: seed
        env:
          HAS_KEYS: ${{ secrets.PG_MIRROR_TOKEN != '' }}
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$HAS_KEYS" != "true" ]; then
            echo "No PG_* secrets configured - building key-free disk images."
            echo "seed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$IS_PRIVATE" != "true" ]; then
            echo "PG_* secrets are configured but this repository is PUBLIC." >&2
            echo "A seeded disk image attached to a public release exposes live" >&2
            echo "database credentials to anyone who finds the URL. Make the" >&2
            echo "repository private before tagging, or remove the secrets." >&2
            exit 1
          fi
          echo "seed=true" >> "$GITHUB_OUTPUT"

      # Values are never echoed -- only the line count. Anything written to the
      # log here would be readable by anyone who can see the run.
      - name: Write seed .env from secrets
        if: steps.seed.outputs.seed == 'true'
        env:
          PG_PROXY_URL: ${{ secrets.PG_PROXY_URL }}
          PG_PROXY_TOKEN: ${{ secrets.PG_PROXY_TOKEN }}
          PG_PROXY_DB: ${{ secrets.PG_PROXY_DB }}
          PG_MIRROR_TOKEN: ${{ secrets.PG_MIRROR_TOKEN }}
          PG_MIRROR_DB: ${{ secrets.PG_MIRROR_DB }}
          PG_MIRROR_SCHEMA: ${{ secrets.PG_MIRROR_SCHEMA }}
          # Unlike Windows, which appends this to the staged payload after the
          # fact, the Mac build packs the payload into the bundle and deletes
          # it -- so the token has to come through the seed file. stage_seed_env
          # allows it for exactly this reason.
          UPDATE_GITHUB_TOKEN: ${{ secrets.UPDATE_GITHUB_TOKEN }}
        run: |
          : > ci-seed.env
          for name in PG_PROXY_URL PG_PROXY_TOKEN PG_PROXY_DB \
                      PG_MIRROR_TOKEN PG_MIRROR_DB PG_MIRROR_SCHEMA \
                      UPDATE_GITHUB_TOKEN; do
            value="${!name}"
            if [ -n "$value" ]; then printf '%s=%s\n' "$name" "$value" >> ci-seed.env; fi
          done
          chmod 600 ci-seed.env
          echo "Wrote ci-seed.env with $(wc -l < ci-seed.env | tr -d ' ') key line(s)."

      # MAC_SIGN_IDENTITY is optional and normally unset: with no Apple
      # Developer ID the build signs ad-hoc, which is what makes the app
      # launchable on Apple Silicon at all. Set the secret to a "Developer ID
      # Application: ..." name (with the certificate imported into the runner
      # keychain) to sign for distribution instead.
      - name: Build macOS disk images (both ARM64 and x86_64)
        env:
          MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
        run: |
          seed_args=""
          if [ "${{ steps.seed.outputs.seed }}" = "true" ]; then
            seed_args="--seed-env ci-seed.env"
          fi
          python3 tools/build_package.py \
            --version ${{ needs.version.outputs.version }} \
            --platform macos-all $seed_args

      # always(), so a failed build cannot leave credentials on the runner.
      - name: Remove the seed file
        if: always()
        run: rm -f ci-seed.env

      - name: Verify the disk images carry payloads
        run: |
          for dmg in dist/CommissionDashboard-Setup-*-macos*.dmg; do
            if [ ! -f "$dmg" ]; then echo "No disk image at $dmg"; exit 1; fi
            mb=$(( $(stat -f%z "$dmg") / 1048576 ))
            echo "Disk image: $(basename $dmg) (${mb} MB)"
            if [ "$mb" -lt 100 ]; then
              echo "Disk image is ${mb} MB - too small to contain the bundled runtime."
              exit 1
            fi
          done

      # Mount each image and check the things that decide whether a Mac user
      # gets a working install or a dead end. Every one of them has shipped
      # broken before, and none of them show up in a file size:
      #   - ONE .app on the image and nothing beside it but the Applications
      #     shortcut. Anything else to drag brings back App Translocation:
      #     Finder exempts an app from it only when the .app itself is dragged,
      #     so a folder on the image is a trap, not a convenience;
      #   - the payload archive inside the bundle, which is the install -- an
      #     app that ships without it starts and then has nothing to run;
      #   - a valid code signature, without which Apple Silicon reports the app
      #     as "damaged" and offers no way past it;
      #   - the Electron framework's symlinks, whose flattening was what
      #     invalidated that signature in the first place.
      - name: Verify the disk images are actually installable
        run: |
          set -e
          for dmg in dist/CommissionDashboard-Setup-*-macos*.dmg; do
            echo "== $(basename "$dmg")"
            mnt=$(mktemp -d)
            hdiutil attach "$dmg" -mountpoint "$mnt" -nobrowse -quiet
            app="$mnt/CommissionDashboard.app"
            res="$app/Contents/Resources"
            fail() { echo "   FAIL: $1"; hdiutil detach "$mnt" -quiet; exit 1; }

            [ -d "$app" ] || fail "no CommissionDashboard.app at the top of the image"
            [ -f "$mnt/READ ME FIRST.txt" ] || fail "no READ ME FIRST.txt"
            [ -L "$mnt/Applications" ] \
              || fail "no Applications shortcut - drag-to-install has nowhere to drop"
            # A folder on the image is what people drag instead of the app, and
            # dragging a folder does not clear translocation. Nothing but the
            # app, the shortcut and the note belongs here.
            for extra in "$mnt"/*; do
              case "$(basename "$extra")" in
                CommissionDashboard.app|Applications|"READ ME FIRST.txt") ;;
                *) fail "unexpected item on the image: $(basename "$extra")" ;;
              esac
            done
            # Without these the image opens as a plain file list and the
            # drag-here layout everyone recognises is simply absent - which
            # looks identical to a successful build from the outside.
            [ -f "$mnt/.DS_Store" ] \
              || fail "no .DS_Store - Finder never arranged the window"
            ls "$mnt/.background/"background.* >/dev/null 2>&1 \
              || fail "no background art on the image"

            [ -f "$res/payload-version.txt" ] || fail "no payload stamp in the bundle"
            [ -f "$res/payload.tar.gz" ] || fail "no payload archive in the bundle"
            list=$(mktemp)
            tar -tzf "$res/payload.tar.gz" > "$list" \
              || fail "the payload archive is not readable"
            grep -qx "./8. Web Dashboard/app.py" "$list" \
              || fail "no Flask app inside the payload archive"
            grep -qx "./runtime/bin/python3" "$list" \
              || fail "no bundled python3 inside the payload archive"
            # Unpack just the interpreter: the archive carries python3 as a
            # symlink to python3.12, and a mode lost in packing is invisible in
            # a listing but fatal on the user's machine.
            probe=$(mktemp -d)
            tar -xzf "$res/payload.tar.gz" -C "$probe" "./runtime/bin" \
              || fail "could not unpack runtime/bin from the payload archive"
            [ -x "$probe/runtime/bin/python3" ] \
              || fail "the bundled python3 is not executable after unpacking"

            # Both directions matter, and the second one more than the first.
            # A seeded build that quietly lost its .env just sends staff to the
            # setup page; an UNSEEDED build that somehow carries one has put
            # live database credentials inside a public release asset. Neither
            # is visible from the outside, so assert both. Key NAMES only --
            # never grep in a way that could echo a value into the log.
            if [ "${{ steps.seed.outputs.seed }}" = "true" ]; then
              grep -qxF "./.env" "$list" || fail "seeded build has no .env in the payload"
              tar -xzf "$res/payload.tar.gz" -C "$probe" "./.env" \
                || fail "could not unpack the seeded .env"
              grep -q "^PG_MIRROR_TOKEN=." "$probe/.env" \
                || fail "the seeded .env carries no PG_MIRROR_TOKEN"
              echo "   ok: seeded .env present (internal distribution only)"
            elif grep -qxF "./.env" "$list"; then
              fail "UNSEEDED build contains a .env - credentials would ship publicly"
            else
              echo "   ok: no .env in the payload, as expected for a key-free build"
            fi

            [ -L "$app/Contents/Frameworks/Electron Framework.framework/Versions/Current" ] \
              || fail "Electron framework symlinks were flattened - the bundle is broken"
            codesign --verify --deep --strict "$app" \
              || fail "the app bundle does not pass codesign - macOS will call it damaged"

            echo "   ok: layout, payload archive, runtime, symlinks, signature"
            hdiutil detach "$mnt" -quiet
          done

      # Same reasoning as the Windows job -- see the note there.
      - name: Attach macOS assets to the draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          draft: true
          files: dist/CommissionDashboard-Setup-*-macos*.dmg

  publish:
    runs-on: ubuntu-latest
    needs: [version, windows, macos]
    steps:
      # Needed only for docs/Commission-Portal-User-Guide.pdf, and it must
      # precede the download below: checkout defaults to clean:true, which
      # would git-clean dist/ out from under the next step.
      - uses: actions/checkout@v4

      # Both platform jobs have already attached their assets to the draft.
      # They come back down here for one reason: SHA256SUMS.txt has to cover
      # every file in a single listing, and updater.py matches its lines by
      # exact asset name.
      - name: Download the assets already on the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download "${{ needs.version.outputs.tag }}" --dir dist --clobber
          ls -lh dist/

      # A draft that is missing a platform must not be published. Without this
      # the run would happily go on to publish whichever half arrived, and the
      # gap would only surface when someone on that platform tried to download.
      - name: Verify every platform is present
        run: |
          v="${{ needs.version.outputs.version }}"
          for f in "CommissionDashboard-Setup-$v.exe"                    "CommissionDashboard-Setup-$v-macos-arm64.dmg"                    "CommissionDashboard-Setup-$v-macos-intel.dmg"                    "CommissionDashboard-update-$v.zip"; do
            if [ ! -f "dist/$f" ]; then
              echo "dist/$f is missing - the draft is incomplete, refusing to publish."
              exit 1
            fi
          done
          echo "All four platform assets are on the draft."

      - name: Add the user guide
        run: |
          # The user guide ships alongside the installer: staff land on the
          # Releases page to download, and that is where they need it. It is
          # committed rather than built here, so no reportlab/font toolchain
          # has to exist on this runner.
          guide="docs/Commission-Portal-User-Guide.pdf"
          if [ ! -f "$guide" ]; then
            echo "$guide is missing - the release would ship without a user guide."
            exit 1
          fi
          cp "$guide" dist/

      # updater.py matches SHA256SUMS lines by exact asset name, so this has to
      # cover everything the release publishes.
      - name: Generate checksums
        run: |
          cd dist
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # draft:false is what makes the release visible. The installers are
      # already attached, so only the two new files are uploaded here.
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          draft: false
          generate_release_notes: true
          body: |
            ## Commission Dashboard ${{ needs.version.outputs.tag }}

            **Download for your platform:**
            - **Windows**: CommissionDashboard-Setup-${{ needs.version.outputs.version }}.exe
            - **macOS** (Apple Silicon, M1 or newer): CommissionDashboard-Setup-${{ needs.version.outputs.version }}-macos-arm64.dmg
            - **macOS** (Intel): CommissionDashboard-Setup-${{ needs.version.outputs.version }}-macos-intel.dmg

            Not sure which Mac you have? Apple menu → About This Mac. "Chip: Apple M…" means arm64; "Processor: Intel…" means intel.

            ### Installing on a Mac

            1. Open the downloaded `.dmg`.
            2. Drag **CommissionDashboard** onto the **Applications** shortcut
               beside it.
            3. Open it from Applications. macOS blocks it the first time — it
               is not an App Store app. Right-click → **Open** → **Open**. On
               macOS Sequoia or newer, go to **System Settings → Privacy &
               Security** and click **Open Anyway** instead.
            4. The first start sets itself up before the dashboard appears and
               takes a minute or two. The window says what it is doing.

            That is the whole install, and step 3 happens only once. Full steps
            are in the user guide below.

            **New here?** Read `Commission-Portal-User-Guide.pdf` below — it
            walks through installing and updating, step by step.

            Sign in with the username and password IT gave you — the installer
            does not ask you to create an account. Ask IT for your access keys
            and add them to `.env` in the install folder.

            Existing users: auto-update is enabled in the dashboard.
          files: |
            dist/Commission-Portal-User-Guide.pdf
            dist/SHA256SUMS.txt
