name: Release

# Push a version tag to cut a release:
#   git tag v1.2.0 && git push origin v1.2.0
#
# Publishes platform-specific assets for Windows and macOS users.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.2.0)"
        required: true

permissions:
  contents: write

jobs:
  # Build update package (platform-agnostic Flask code)
  build-update-package:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ github.event.inputs.version }}".TrimStart("v")
          } else {
            $v = "${{ github.ref_name }}".TrimStart("v")
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $v"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build update package
        shell: pwsh
        run: python tools/build_package.py --version ${{ steps.ver.outputs.version }}

      - name: Upload update package
        uses: actions/upload-artifact@v4
        with:
          name: update-package
          path: dist/CommissionDashboard-update-*.zip
          retention-days: 1

  # Build Windows desktop app
  build-windows:
    runs-on: windows-latest
    needs: build-update-package

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Electron app (Windows)
        working-directory: 10. Electron App/app
        run: |
          npm ci
          npm run dist

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: 10. Electron App/app/dist/CommissionDashboard *.exe
          retention-days: 1

  # Build macOS desktop app
  build-macos:
    runs-on: macos-latest
    needs: build-update-package

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Electron app (macOS)
        working-directory: 10. Electron App/app
        run: |
          npm ci
          npm run dist

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: 10. Electron App/app/dist/CommissionDashboard-*.zip
          retention-days: 1

  # Create release with all artifacts
  publish:
    runs-on: ubuntu-latest
    needs: [build-update-package, build-windows, build-macos]
    if: always() && needs.build-update-package.result == 'success'

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize artifacts
        run: |
          mkdir -p dist
          # Update package
          find artifacts/update-package -name "*.zip" -exec mv {} dist/ \;
          # Windows app
          find artifacts/windows-app -name "*.exe" -exec mv {} dist/ \;
          # macOS app
          find artifacts/macos-app -name "*.zip" -exec mv {} dist/CommissionDashboard-${{ needs.build-update-package.outputs.version }}-macos.zip \;
          ls -lh dist/

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-update-package.outputs.tag }}
          name: ${{ needs.build-update-package.outputs.tag }}
          generate_release_notes: true
          body: |
            ## Commission Dashboard ${{ needs.build-update-package.outputs.tag }}

            **Download for your platform:**
            - **Windows**: CommissionDashboard-Setup-${{ needs.build-update-package.outputs.version }}.exe
            - **macOS**: CommissionDashboard-Setup-${{ needs.build-update-package.outputs.version }}-macos.zip

            Existing users: Auto-update is enabled in the dashboard.
          files: |
            dist/CommissionDashboard-Setup-*.exe
            dist/CommissionDashboard-Setup-*-macos.zip
            dist/CommissionDashboard-update-*.zip
            dist/SHA256SUMS.txt
