name: Release

# Push a version tag to cut a release:
#   git tag v1.2.0 && git push origin v1.2.0
#
# Publishes the Windows installer and the code-only OTA update package.
#
# The Windows asset is the Inno installer compiled from
# installer/CommissionDashboard.iss over dist/payload -- NOT electron-builder's
# output. That distinction matters: this workflow used to publish the portable
# shell exe renamed to "...-Setup-<ver>.exe", which is the Electron window and
# nothing else. It carries no "8. Web Dashboard", no Python runtime, so
# main.js's findCommissionRoot() found no app.py and every download died on
# "Could not find the dashboard files". A real installer is ~120 MB against the
# shell's ~80 MB; if this asset ever comes out at 80 MB again, ISCC did not run.
#
# ACCESS KEYS. The installer can ship with .env pre-filled so staff never paste
# tokens. That is off unless BOTH hold:
#
#   1. the PG_* repository secrets exist (PG_PROXY_URL, PG_PROXY_TOKEN,
#      PG_PROXY_DB, PG_MIRROR_TOKEN, PG_MIRROR_DB, optionally
#      PG_MIRROR_SCHEMA), and
#   2. the repository is PRIVATE.
#
# Release assets inherit repository visibility, so a seeded installer on a
# public repo hands live database credentials to anyone who finds the URL. If
# the secrets are set while the repo is still public the build FAILS rather
# than publishing them -- deliberately, because the tempting order of
# operations is to add the secrets first and flip visibility afterwards. With
# no secrets set the build simply produces a key-free installer, which is what
# every release up to v1.2.10 was.
#
# The OTA zip is never affected: it is built from the code file list, where
# *.env is excluded.
#
# macOS is deliberately NOT published. tools/build_package.py carries constants
# for it (SHELL_BUILD_MAC, PYTHON_MAC_URL, MAC_APP_NAME) but nothing references
# them -- there is no code path that stages the dashboard and an arm64 runtime
# next to the .app the way the Windows payload does. Zipping the bare .app just
# reproduces the failure described above on a platform that cannot even fall
# back to "Launch Dashboard.bat", so it is better to ship nothing than that.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.2.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      seeded: ${{ steps.seed.outputs.seed }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ github.event.inputs.version }}".TrimStart("v")
          } else {
            $v = "${{ github.ref_name }}".TrimStart("v")
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $v"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Must precede build_package.py: it copies dist/win-unpacked into the
      # payload as shell/, and check_shell_fresh() aborts the build if that
      # folder is older than main.js.
      - name: Build Electron shell
        working-directory: 10. Electron App/app
        run: |
          npm ci
          npm run dist

      # Never trust the tag author to have flipped visibility first. See the
      # header: secrets present + public repo is a hard failure, not a warning.
      - name: Decide whether to seed access keys
        id: seed
        shell: pwsh
        env:
          HAS_KEYS: ${{ secrets.PG_MIRROR_TOKEN != '' }}
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if ($env:HAS_KEYS -ne 'true') {
            Write-Host "No PG_* secrets configured - building a key-free installer."
            "seed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          if ($env:IS_PRIVATE -ne 'true') {
            throw "PG_* secrets are configured but this repository is PUBLIC. A seeded installer attached to a public release exposes live database credentials to anyone who finds the URL. Make the repository private before tagging, or remove the secrets."
          }
          Write-Host "Repository is private and keys are configured - seeding the installer."
          "seed=true" >> $env:GITHUB_OUTPUT

      # Values arrive as env vars so they are never written into the command
      # line, and only the count is printed. Actions masks them in logs either
      # way, but a masked secret in an argv is still a secret in an argv.
      - name: Write seed .env from secrets
        if: steps.seed.outputs.seed == 'true'
        shell: pwsh
        env:
          PG_PROXY_URL: ${{ secrets.PG_PROXY_URL }}
          PG_PROXY_TOKEN: ${{ secrets.PG_PROXY_TOKEN }}
          PG_PROXY_DB: ${{ secrets.PG_PROXY_DB }}
          PG_MIRROR_TOKEN: ${{ secrets.PG_MIRROR_TOKEN }}
          PG_MIRROR_DB: ${{ secrets.PG_MIRROR_DB }}
          PG_MIRROR_SCHEMA: ${{ secrets.PG_MIRROR_SCHEMA }}
        run: |
          $names = 'PG_PROXY_URL','PG_PROXY_TOKEN','PG_PROXY_DB',
                   'PG_MIRROR_TOKEN','PG_MIRROR_DB','PG_MIRROR_SCHEMA'
          $lines = @()
          foreach ($n in $names) {
            $v = [Environment]::GetEnvironmentVariable($n)
            if ($v) { $lines += "$n=$v" }
          }
          Set-Content -Path "ci-seed.env" -Value $lines -Encoding ascii
          Write-Host "Wrote ci-seed.env with $($lines.Count) key line(s)."

      - name: Stage payload and OTA package
        shell: pwsh
        run: |
          $seedArg = @()
          if ("${{ steps.seed.outputs.seed }}" -eq "true") {
            $seedArg = @("--seed-env", "ci-seed.env")
          }
          python tools/build_package.py --version ${{ steps.ver.outputs.version }} @seedArg

      # The runner is ephemeral, but the file has served its purpose the moment
      # build_package.py has copied it into the payload.
      - name: Remove the seed file
        if: always()
        shell: pwsh
        run: Remove-Item "ci-seed.env" -Force -ErrorAction SilentlyContinue

      - name: Locate Inno Setup
        id: inno
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host "Inno Setup is not on the runner image - installing it."
            choco install innosetup --no-progress -y
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe not found after installing Inno Setup." }
          Write-Host "Using $iscc"
          "iscc=$iscc" >> $env:GITHUB_OUTPUT

      - name: Compile Windows installer
        shell: pwsh
        run: >
          & "${{ steps.inno.outputs.iscc }}"
          /DAppVersion=${{ steps.ver.outputs.version }}
          "installer\CommissionDashboard.iss"

      # The installer is the whole point of the release, and a shell-only exe
      # looks identical to a working one in the assets list. Fail the build
      # rather than publish that again.
      - name: Verify the installer carries a payload
        shell: pwsh
        run: |
          $exe = "dist\CommissionDashboard-Setup-${{ steps.ver.outputs.version }}.exe"
          if (-not (Test-Path $exe)) { throw "ISCC produced no installer at $exe" }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB)
          Write-Host "Installer: $exe ($mb MB)"
          if ($mb -lt 100) {
            throw "Installer is ${mb} MB - too small to contain the bundled Python runtime. It is probably the bare Electron shell."
          }

      # build_package.py wrote SHA256SUMS.txt before the installer existed;
      # this folds the installer in. updater.py matches lines by exact asset
      # name, so this has to cover everything the release publishes.
      - name: Refresh checksums
        shell: pwsh
        run: python tools/build_package.py --checksums-only

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            dist/CommissionDashboard-Setup-*.exe
            dist/CommissionDashboard-update-*.zip
            dist/SHA256SUMS.txt
          retention-days: 1

  publish:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: List what is being published
        run: ls -lh dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: ${{ needs.build.outputs.tag }}
          generate_release_notes: true
          body: |
            ## Commission Dashboard ${{ needs.build.outputs.tag }}

            **Windows**: CommissionDashboard-Setup-${{ needs.build.outputs.version }}.exe

            Sign in with the username and password IT gave you — the installer
            does not ask you to create an account.

            ${{ needs.build.outputs.seeded == 'true' && 'Your access keys are already included, so there is nothing to paste. Do not forward this installer outside the company — it carries live database credentials.' || 'Ask IT for your access keys and add them to `.env` in the install folder.' }}

            macOS is not available for download yet.

            Existing users: auto-update is enabled in the dashboard.
          files: |
            dist/CommissionDashboard-Setup-*.exe
            dist/CommissionDashboard-update-*.zip
            dist/SHA256SUMS.txt
